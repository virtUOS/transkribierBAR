version: 2

updates:
  # Frontend (React/Vite)
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      frontend:
        update-types:
          - minor
          - patch
    ignore:
      # video.js 10 is a stub that points to @videojs/html and @videojs/react and
      # throws on Video.js 8 code; moving to those is a migration, not an update.
      # 8.x still gets patches.
      - dependency-name: video.js
        update-types:
          - version-update:semver-major

  # Backend: requirements*.in, lock files generated by `uv pip compile`.
  # The uv ecosystem re-runs that command; pip would run pip-compile instead.
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend:
        update-types:
          - minor
          - patch

  # Base images of the application image. New Python and Node versions come
  # as separate PRs: CI fails until backend/.python-version or
  # frontend/.node-version is bumped to match.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - python
          - node

  # Actions are pinned to major tags, so every update is a major one: no group
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"

  # Example deployment
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      compose:
        update-types:
          - minor
          - patch
