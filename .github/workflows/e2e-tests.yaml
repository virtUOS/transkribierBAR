name: End-to-end tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install ffmpeg and PulseAudio
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg pulseaudio

      # The runner has no audio output. Without one, Firefox never starts an
      # AudioContext, which the recorder uses for its start beep and for mixing
      # a second input. A null sink stands in for the speakers of a desktop.
      - name: Start an audio server with a null sink
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=e2e
          pactl set-default-sink e2e

      - name: Install backend dependencies
        working-directory: backend
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium and Firefox for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
