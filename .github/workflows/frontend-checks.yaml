name: Frontend checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      # Dependabot bumps the base image on its own; the PR stays red until
      # frontend/.node-version (and with it CI) moves to the same version.
      - name: Check that the Dockerfile uses the same Node.js
        run: |
          want=$(cat frontend/.node-version)
          have=$(sed -n 's/^FROM node:\([0-9.]*\)-.*/\1/p' Dockerfile)
          if [ "$have" != "$want" ]; then
            echo "::error file=Dockerfile::Dockerfile uses Node.js $have, frontend/.node-version says $want"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test
